name: EFT - test, build, push y deploy a EKS

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: microservicios-eks

jobs:
  # ===========================================================
  # ETAPA 1 - PRUEBAS UNITARIAS
  # ===========================================================
  test:
    name: Pruebas unitarias (pytest estadisticas-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r estadisticas-service\requirements.txt
      - name: Ejecutar pruebas
        run: pytest estadisticas-service

  # ===========================================================
  # ETAPA 2 - BUILD DE IMÁGENES
  # ===========================================================
  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build imagen estadisticas-service
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/estadisticas-service:$IMAGE_TAG" -t "$REGISTRY/estadisticas-service:latest" ./estadisticas-service

  # ===========================================================
  # ETAPA 3 - PUSH A ECR
  # ===========================================================
  push:
    name: Push a Amazon ECR
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push imagen estadisticas-service
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/estadisticas-service:$IMAGE_TAG"
          docker push "$REGISTRY/estadisticas-service:latest"

  # ===========================================================
  # ETAPA 4 - DEPLOY EN EKS
  # ===========================================================
  deploy:
    name: Deploy en EKS
    runs-on: ubuntu-latest
    needs: push
    steps:
      - uses: actions/checkout@v4
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Conectar kubectl al cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
      - name: Aplicar manifests estadisticas-service
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s|<ACCOUNT_ID>|$ACCOUNT_ID|g; s|<REGION>|$AWS_REGION|g; s|estadisticas-service:latest|estadisticas-service:$IMAGE_TAG|g" estadisticas-service/k8s/deployment.yaml
          kubectl apply -f estadisticas-service/k8s/deployment.yaml
          kubectl apply -f estadisticas-service/k8s/service.yaml
      - name: Verificar rollout
        run: kubectl rollout status deployment/estadisticas-service --timeout=180s
